name: CI

# Enforces what Step 54 already locks. This workflow introduces no policy —
# every gate below traces to a locked decision, cited in its job description.
#
# Jobs 1–5 are conventional. Jobs 6–8 are specific to LegalMind: they guard the
# append-only master record, the normative golden corpus, and the rule that real
# counterparty contracts never enter the repository.

on:
  pull_request:
  # Every branch, not only `main`. Work here lands on long-lived feature branches
  # without a pull request open, so under `branches: [main]` no job ran for five
  # days of commits — long enough for the core Review screen to ship a runtime
  # crash (React #310, 2026-08-24) that job 10 would have caught on the first push
  # and that nobody saw until the browser suite was run by hand on 2026-08-26. The
  # `concurrency` group below cancels superseded runs, so the cost is one run per
  # push, not one per commit.
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  LEGALMIND_TEST_DATABASE_URL: postgresql+psycopg2://legalmind:legalmind@127.0.0.1:5432/legalmind_v1_test
  LEGALMIND_DATABASE_URL: postgresql+psycopg2://legalmind:legalmind@127.0.0.1:5432/legalmind_v1_dev

jobs:

  # ── 1 ──────────────────────────────────────────────────────────────────────
  lint:
    name: 1 · Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install ruff mypy
      # BLOCKING since 2026-08-17. The baseline was measured (228 ruff findings, 33
      # mypy errors), configured where the default rules were wrong for this codebase,
      # and fixed to zero — so the gate is real rather than advisory. Two findings were
      # genuine: an authorization call whose result was bound to an unused name, and
      # ten `db.get()` results used without narrowing on paths a NOT NULL foreign key
      # already guarantees (now `db.lookup.must_exist`, which fails loudly instead of
      # propagating None into the decision path).
      #
      # `ruff format --check` is deliberately NOT run: it would reflow 85 files, and
      # the hand-aligned tables and dense rule citations in this codebase are
      # documentation of locked decisions. Rationale in `backend/pyproject.toml`.
      - name: ruff
        working-directory: backend
        run: ruff check .
      - name: mypy
        working-directory: backend
        run: mypy

  # ── 2 ──────────────────────────────────────────────────────────────────────
  schema-invariants:
    name: 2 · Schema invariants (EV-MIN, append-only, uniqueness)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalmind
          POSTGRES_PASSWORD: legalmind
          POSTGRES_DB: legalmind_v1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'

      # The suite builds its schema by running the real Alembic migration
      # (conftest.engine), so the hand-written trigger DDL is genuinely tested.
      # metadata.create_all() would silently skip it.
      - name: Invariant tests
        working-directory: backend
        # The locked-column snapshot and the assist-schema checks belong here rather
        # than only in job 13: a schema regression should fail fast and by name.
        # `AM-27` r2 names the invariant tests as its evidence that no locked table
        # changed, and test_locked_schema_columns.py is what makes that true.
        run: |
          python -m pytest tests/test_schema_invariants.py \
                           tests/test_locked_schema_columns.py \
                           tests/test_assist_schema.py \
                           tests/test_assist_indexing.py \
                           tests/test_assist_ask.py \
                           tests/test_import_boundaries.py -q

      # The trigger-presence assertion now lives in the suite itself
      # (test_locked_invariants_are_enforced_by_triggers_not_convention and
      # test_ev_min_triggers_are_deferred_to_commit), so it runs inside the same
      # fixtures and inspects the private schema this run actually migrated.
      #
      # The standalone probe that used to sit here opened its own connection,
      # where current_schema() is `public` — a schema the suite never migrates
      # into. On a fresh database it found nothing and failed; on a developer
      # machine it found stale tables from earlier runs and passed. Neither
      # answer was about this run.

      # F-1 closed 2026-08-17. Migration 9c2f41ab77e3 added the deferred
      # AFTER DELETE and AFTER UPDATE constraint triggers on evaluations, so the
      # removal path is covered. The warning step that stood here is gone rather
      # than reworded: it asserted nothing, and a CI annotation stating that a
      # fixed bug is still open is worse than no annotation. The guarantee is
      # now enforced by test_ev_min_triggers_are_deferred_to_commit, which fails
      # if any of the three triggers is missing.

  # ── 3 ──────────────────────────────────────────────────────────────────────
  authorization:
    name: 3 · Authorization matrix (RELEASE-BLOCKING)
    runs-on: ubuntu-latest
    # Step 54: "AUTHORIZATION TESTS ARE RELEASE-BLOCKING." This job must never
    # be made advisory, and must never be marked continue-on-error.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalmind
          POSTGRES_PASSWORD: legalmind
          POSTGRES_DB: legalmind_v1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'

      - name: Service-layer authorization and sessions
        working-directory: backend
        run: python -m pytest tests/test_authorization.py tests/test_sessions.py -q

      # The Step 54 list includes properties that only exist at HTTP level:
      # "permission matrix: every endpoint x every role" and "out-of-scope 404
      # and non-existent 404 byte-identical". Those cannot be discharged by
      # service-layer tests.
      - name: API-level authorization
        working-directory: backend
        run: python -m pytest tests/test_api_authz.py tests/test_api_contract.py -q

      # NOTE: a standalone "every route declares a permission" step used to sit
      # here. It was removed as redundant AND wrong: tests/test_api_contract.py
      # already asserts this properly via
      #   test_every_registered_route_declares_a_permission  — bidirectional set
      #     equality between registered_routes(app) and ENDPOINT_PERMISSIONS, so
      #     it also catches a mapping entry for a route that no longer exists;
      #   test_only_health_is_unauthenticated_by_design       — pins the exempt set.
      # The removed step did a substring match against str(declared) and would
      # have false-positived on the deliberate UNAUTHENTICATED sentinels.
      # Those tests run in the "API-level authorization" step above and remain
      # the authoritative check.

  # ── 4 ──────────────────────────────────────────────────────────────────────
  golden-corpus:
    name: 4 · Golden corpus (Tier 1, normative)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalmind
          POSTGRES_PASSWORD: legalmind
          POSTGRES_DB: legalmind_v1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'

      # ENG-12 / Step 54: the corpus runs IN FULL on any mapping, extraction or
      # evaluation change. It is cheap; it runs on every push regardless.
      - name: Corpus and evaluation suites
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_golden_corpus.py \
            tests/test_evaluation_numeric.py \
            tests/test_evaluation_presence.py \
            tests/test_evaluation_service.py \
            tests/test_mapping.py tests/test_mapping_service.py \
            tests/test_ingestion.py -q

      # 45E.1: every fixture asserts BOTH the scoped Evaluation set AND the
      # derived Finding summary. A fixture asserting the roll-up alone is
      # rejected by the loader; surface the count so silent shrinkage is visible.
      - name: Report corpus size and provenance
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from legalmind.evaluation import corpus
          fx = corpus.load_fixtures(Path('tests/corpus'))
          prov = {}
          for f in fx:
              prov[f.provenance] = prov.get(f.provenance, 0) + 1
          print(f"fixtures: {len(fx)}  by provenance: {prov}")
          print("::notice title=Corpus coverage::"
                f"{len(fx)} of the 64 fixtures specified in Step 45E are present. "
                "NORMATIVE fixtures require real representative contracts and the "
                "organization's real Company Standards — they must be supplied, never authored.")
          PY

  # ── 5 ──────────────────────────────────────────────────────────────────────
  determinism:
    name: 5 · Determinism (ENG-11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalmind
          POSTGRES_PASSWORD: legalmind
          POSTGRES_DB: legalmind_v1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'

      # "Identical inputs + configuration snapshot + evaluator version ->
      # BYTE-IDENTICAL output. No clock, random source, locale or environment
      # variable may affect a result." Run under a deliberately hostile locale
      # and timezone so an environment dependency shows up here, not in court.
      # Turkish is where "I".lower() stops being "i". If the locale is missing the
      # check silently degrades to a no-op, so generate it — but never fail the
      # job over it: a missing locale weakens this probe, it is not a defect in
      # the code under test.
      - name: Generate hostile locale
        run: |
          sudo locale-gen tr_TR.UTF-8 && sudo update-locale \
            || echo "::warning title=Locale unavailable::tr_TR.UTF-8 could not be generated; the locale-sensitivity half of the determinism check is inert this run"

      - name: Corpus output is byte-identical across runs
        working-directory: backend
        env:
          TZ: Pacific/Kiritimati
          LC_ALL: tr_TR.UTF-8
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          from legalmind.evaluation import corpus

          fx = corpus.load_fixtures(Path('tests/corpus'))
          digests = []
          for _ in range(3):
              out = corpus.run_corpus(fx)
              blob = json.dumps([o.__dict__ for o in out], sort_keys=True, default=str)
              digests.append(hashlib.sha256(blob.encode()).hexdigest())

          for i, d in enumerate(digests, 1):
              print(f"  run{i}: {d}")
          if len(set(digests)) != 1:
              print("::error title=ENG-11 violated::corpus output is not byte-identical across runs")
              sys.exit(1)
          print("byte-identical across 3 runs")
          PY

      # F-4, open at time of writing: the suite itself is non-deterministic —
      # five identical runs produced 0, 2, 3 and 62 errors. A flaky suite makes
      # every gate above unreadable. Surface it rather than re-running to green.
      - name: Suite stability probe
        working-directory: backend
        run: |
          set +e
          fails=0
          for i in 1 2 3; do
            python -m pytest -q > "/tmp/run$i.txt" 2>&1
            code=$?
            tail -1 "/tmp/run$i.txt"
            [ $code -ne 0 ] && fails=$((fails+1))
          done
          if [ $fails -gt 0 ] && [ $fails -lt 3 ]; then
            echo "::error title=F-4 flaky suite::the suite passed some runs and failed others on identical code — results from every other job are unreliable until this is fixed"
            exit 1
          fi
          exit 0

  # ── 6 ──────────────────────────────────────────────────────────────────────
  append-only-record:
    name: 6 · all_lock.md is append-only
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The master record is append-only. Twelve documents assert that prior
      # line counts are byte-identical, and historical reproducibility depends
      # on it. Additions at EOF only; any deletion or modification fails.
      - name: Reject any modification to existing lines
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if ! git diff --quiet "$base" -- all_lock.md; then
            deletions=$(git diff --numstat "$base" -- all_lock.md | awk '{print $2}')
            echo "lines added: $(git diff --numstat "$base" -- all_lock.md | awk '{print $1}') | removed: $deletions"
            if [ "${deletions:-0}" -ne 0 ]; then
              echo "::error title=all_lock.md is append-only::this diff removes or modifies $deletions existing line(s). Approved changes are APPENDED as a new lock record; superseded text stays where it is."
              git diff "$base" -- all_lock.md | head -40
              exit 1
            fi
            # Additions must be at EOF: the old file must be a byte-exact prefix.
            git show "$base:all_lock.md" > /tmp/base_all_lock.md
            old=$(wc -l < /tmp/base_all_lock.md)
            head -n "$old" all_lock.md > /tmp/new_prefix.md
            if ! cmp -s /tmp/base_all_lock.md /tmp/new_prefix.md; then
              echo "::error title=Not an append::the first $old lines are no longer byte-identical. Changes must be appended at end of file."
              exit 1
            fi
            echo "append verified: first $old lines byte-identical"
          else
            echo "all_lock.md unchanged"
          fi

  # ── 7 ──────────────────────────────────────────────────────────────────────
  golden-expectation-guard:
    name: 7 · Changed corpus expectation = specification change
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 54: "A changed expected output is a SPECIFICATION CHANGE, reviewed
      # as such, never edited to make a build pass." Override requires the
      # explicit `specification-change` label — a conscious act, reviewable in
      # the PR record.
      - name: Guard fixture expectations
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base" -- 'backend/tests/corpus/**' || true)
          if [ -z "$changed" ]; then
            echo "no corpus fixtures changed"
            exit 0
          fi
          echo "changed fixtures:"; echo "$changed" | sed 's/^/  /'
          labels='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$labels" | grep -q 'specification-change'; then
            echo "::notice title=Specification change::corpus expectations changed under an explicit \`specification-change\` label"
            exit 0
          fi
          echo "::error title=Golden expectation changed::a changed expected output is a specification change, not a test fix (Step 54). If this is intended, apply the \`specification-change\` label and say in the PR which decision it follows from."
          exit 1

  # ── 8 ──────────────────────────────────────────────────────────────────────
  no-real-contracts:
    name: 8 · No real legal source material
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 54: "Synthetic or cleared text only. Real counterparty contracts
      # never enter the repository." Step 55: real contracts never leave
      # production. .gitignore already excludes these types; this catches a
      # deliberate `git add -f`.
      - name: Reject contract file types
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # Archives included: a .zip of PDFs bypassed an extension-only rule
          # on 2026-08-18. Blocking the container as well as the contents.
          added=$(git diff --diff-filter=A --name-only "$base" | grep -iE '\.(pdf|docx?|xlsx?|rtf|zip|tar|tgz|gz|7z|rar)$' | grep -v '^docs/' || true)
          if [ -n "$added" ]; then
            echo "::error title=Contract file added::real counterparty contracts never enter the repository (Step 54). Corpus fixtures are synthetic or cleared text only."
            echo "$added" | sed 's/^/  /'
            exit 1
          fi
          echo "no contract file types added"

      # A NORMATIVE fixture asserts a real legal position and requires real
      # representative contracts plus the organization's real Company Standards.
      # One appearing in a PR without a recorded source is how invented legal
      # content becomes normative.
      - name: Flag NORMATIVE fixtures without a recorded source
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --diff-filter=AM --name-only "$base" -- 'backend/tests/corpus/**' || true)
          fail=0
          for f in $changed; do
            [ -f "$f" ] || continue
            if grep -q '"provenance"[[:space:]]*:[[:space:]]*"NORMATIVE"' "$f"; then
              if ! grep -qE '"source"|"source_document"|"supplied_by"' "$f"; then
                echo "::error title=Unsourced NORMATIVE fixture::$f asserts a real legal position with no recorded source"
                fail=1
              fi
            fi
          done
          [ $fail -eq 0 ] && echo "no unsourced NORMATIVE fixtures"
          exit $fail

  # ── 9 ──────────────────────────────────────────────────────────────────────
  frontend:
    name: 9 · Frontend (typecheck + Vitest)
    runs-on: ubuntu-latest
    # Nothing ran these until 2026-08-17: the 53 Vitest tests and the typecheck
    # were enforced only by whoever remembered to run them locally. The suite
    # includes the confidentiality boundary tests (52.4 — omitted, not nulled) and
    # the rule that only `lib/api.ts` may call `fetch` (38.22), so leaving them
    # unenforced left two locked properties on the honour system.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Vitest
        working-directory: frontend
        run: npx vitest run

  # ── 10 ─────────────────────────────────────────────────────────────────────
  browser-workflows:
    name: 10 · Browser workflows (Playwright)
    runs-on: ubuntu-latest
    # SUPPORTING, not a release gate. Locked 54.1's six tiers contain no browser
    # tier and 54.7's release gate does not list one, so this job must not be
    # described as either. It exists for the locked properties that cannot be
    # proved without a real browser: S-3's HttpOnly session cookie, LEGAL-02
    # omission surviving the Next proxy to the page, and 52.7's no-optimistic-UI
    # rule for Legal Decisions.
    #
    # The framework is Step 39's (`Pytest + Playwright`). Note C-12: locked 54.7
    # lists "test framework selection" as NOT YET SPECIFIED, which sits oddly
    # beside that table — registered, unresolved, and blocking nothing, since both
    # readings permit Playwright.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalmind
          POSTGRES_PASSWORD: legalmind
          POSTGRES_DB: legalmind_v1_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LEGALMIND_E2E_DATABASE_URL: postgresql+psycopg2://legalmind:legalmind@127.0.0.1:5432/legalmind_v1_e2e
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]' && pip install uvicorn
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      # Chromium only. The locked properties under test are not browser-specific,
      # and three engines would triple the runtime for no additional guarantee.
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Playwright's own webServer starts the API and the Next production build,
      # and its global setup creates and migrates the e2e database.
      - name: Browser workflows
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── 11 ─────────────────────────────────────────────────────────────────────
  reproducibility:
    name: 11 · Post-migration reproducibility (locked 55.4 r3)
    runs-on: ubuntu-latest
    # Locked 55.4 r3: "after any migration, historical Reviews must still replay
    # identically (ENG-11) — this is a release-gate test (54.3), NOT an assumption."
    # Locked 55.5 places it between "migration applied" and "deploy".
    #
    # Two properties, neither requiring any interpretation of a persisted row:
    #   55.4 r1  the records written before the migration are unchanged after it
    #   55.4 r3  the same document + snapshot still produce the same legal record
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalmind
          POSTGRES_PASSWORD: legalmind
          POSTGRES_DB: legalmind_v1_repro
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Reproducibility survives migration
        working-directory: backend
        env:
          LEGALMIND_REPRO_DATABASE_URL: postgresql+psycopg2://legalmind:legalmind@127.0.0.1:5432/legalmind_v1_repro
        run: python -m tools.verify_reproducibility

  # ── 12 ─────────────────────────────────────────────────────────────────────
  independent-verification:
    name: 12 · Invariants verified without the tests that assert them
    runs-on: ubuntu-latest
    # The guarantees are re-checked by a DIFFERENT mechanism from the unit tests:
    # raw SQL outside the ORM for EV-MIN and append-only, two live schemas for the
    # enum-scoping fix, real worker processes and a real SIGKILL for the queue.
    # A test and the code it guards can share a wrong assumption — this job exists
    # because that already happened once here (`test_each_axis_has_its_own_enum_type`
    # was recorded as fixed while the predicate it needed was absent).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalmind
          POSTGRES_PASSWORD: legalmind
          POSTGRES_DB: legalmind_v1_verify
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6399:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]' && sudo apt-get install -y redis-tools
      - name: Independent verification
        working-directory: backend
        env:
          LEGALMIND_VERIFY_DATABASE_URL: postgresql+psycopg2://legalmind:legalmind@127.0.0.1:5432/legalmind_v1_verify
        run: python -m tools.verify_invariants --redis-port 6399

  # ── 13 ─────────────────────────────────────────────────────────────────────
  full-suite:
    name: 13 · The whole test suite (release gate)
    runs-on: ubuntu-latest
    # Why this job exists, given twelve others already run tests.
    #
    # Jobs 2, 3, 4, 9, 10, 11 and 12 each name specific files. Job 5's stability probe runs
    # the whole suite three times, but its predicate is deliberately
    #
    #     if [ $fails -gt 0 ] && [ $fails -lt 3 ]
    #
    # because it is an `F-4` FLAKE detector: it fires when identical code passes some runs and
    # fails others. Three failures out of three is not flaky, so the probe correctly exits 0 —
    # and that is exactly right for what it measures. The probe is not changed by this job.
    #
    # The consequence, though, was that a CONSISTENTLY failing suite passed CI, and roughly a
    # dozen test files — test_analysis, test_worker, test_api_resources, test_api_findings,
    # test_api_decisions, test_observability, test_corpus_coverage, test_calibration_*,
    # test_deploy_preflight, test_source_material, test_extraction_liability,
    # test_workflow_decisions — appeared in no job's explicit list at all. They executed inside
    # the probe and their result was discarded.
    #
    # That matters more now than it did. AB-3 and AB-4 place several guarantees in tests and
    # nowhere else: `AM-25` r2's database-grant check, r6/r7's retrieval indistinguishability,
    # `AM-27` r2's locked-column snapshot, `AM-30` t8's egress allow-list. `AM-28` r2's own
    # reasoning applies — "a guardrail that a prompt change can affect is not a guardrail" —
    # and a guardrail no job gates is not one either.
    #
    # Blocking, and it runs the suite once. Total cost across CI is unchanged in kind: the
    # probe was already running it three times.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalmind
          POSTGRES_PASSWORD: legalmind
          POSTGRES_DB: legalmind_v1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'
      # `AM-30` t1 and t8: the application makes no outbound network call, and
      # `test_import_boundaries.py` asserts it. A credential present in CI would mean a
      # misconfigured job could egress from a pull request. Assert its absence rather than
      # trusting that nobody adds one.
      - name: No model-provider credential is present in CI
        run: |
          for var in GEMINI_API_KEY GOOGLE_API_KEY GOOGLE_APPLICATION_CREDENTIALS \
                     LEGALMIND_MODEL_API_KEY; do
            if [ -n "${!var:-}" ]; then
              echo "::error title=AM-30 t1::$var is set in CI; the document path must have no egress here"
              exit 1
            fi
          done
          echo "no provider credential present"
      - name: Full suite
        working-directory: backend
        run: python -m pytest -q

  # ── 14 ─────────────────────────────────────────────────────────────────────
  security-scanning:
    name: 14 · Dependency and container security scanning (A10)
    runs-on: ubuntu-latest
    # `IMPLEMENTATION_READINESS_GATE.md` §5b unit A10 names five controls: network
    # segmentation, TLS, secrets, Trivy/pip-audit/npm audit, OpenVAS/ZAP. The first
    # three are deployment-time and already reported by
    # `legalmind.deploy.preflight` (they are properties of where the app runs, not
    # of the repository). This job is the other two, split by what a CI runner can
    # actually do:
    #
    #   - pip-audit and npm audit scan dependencies this repository pins, so they
    #     are exact and reproducible here. Both were measured before this job was
    #     written: pip-audit against an editable install of `backend/pyproject.toml`
    #     found zero known vulnerabilities; `npm audit` against
    #     `frontend/package-lock.json` found zero across prod, dev and optional
    #     (161 packages). Blocking on ANY finding matches job 1's own precedent —
    #     ruff/mypy block on a zero baseline rather than an invented tolerance.
    #   - Trivy scans the two built images. CRITICAL/HIGH is blocking;
    #     `ignore-unfixed: true` because a vulnerability with no available fix
    #     cannot be resolved by a change in this repository, and a gate nobody can
    #     satisfy is not a gate — it is the path to the gate being disabled, which
    #     is the opposite of what job 1's "measured, not advisory" precedent
    #     intends. MEDIUM/LOW are reported, not blocking, for the same reason.
    #
    #   OpenVAS/ZAP scan a *running* instance, not a repository. Standing one up
    #   would mean orchestrating Postgres + Redis + the API + the frontend inside
    #   this workflow — a materially larger addition than an additive scan step,
    #   and one that changes what CI *is* rather than what it checks. Left for the
    #   deployment pipeline, alongside the TLS and backup-restore controls
    #   `preflight` already reports as ATTEST for the same reason: some things are
    #   properties of a live, running deployment and cannot be true of a checkout.
    #
    # Not build-tested anywhere else: this job is also the first place either
    # Dockerfile is actually built in CI.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend + pip-audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install pip-audit
      - name: pip-audit (backend dependencies)
        working-directory: backend
        run: pip-audit --desc

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: npm audit (frontend dependencies)
        working-directory: frontend
        run: npm audit

      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: legalmind-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: legalmind-frontend:ci

      - name: Trivy — backend image (CRITICAL/HIGH, blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: legalmind-backend:ci
          format: table
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy — backend image (MEDIUM/LOW, report only)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: legalmind-backend:ci
          format: table
          severity: "MEDIUM,LOW"
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy — frontend image (CRITICAL/HIGH, blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: legalmind-frontend:ci
          format: table
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy — frontend image (MEDIUM/LOW, report only)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: legalmind-frontend:ci
          format: table
          severity: "MEDIUM,LOW"
          ignore-unfixed: true
          exit-code: "0"

  # ── 15 ─────────────────────────────────────────────────────────────────────
  design-qa:
    name: 15 · Design QA (forbidden terms + visual regression)
    runs-on: ubuntu-latest
    # Two gates from the 2026-08-27 UI/UX hardening pass, both design-governance
    # rules made structural rather than reviewed-for:
    #
    #   1. Forbidden terms — rule 12 / AI-03 item 16: no confidence, risk-score,
    #      probability or likelihood figure may reach the UI. The checker strips
    #      comments first (a comment FORBIDDING the word is the rule, not a
    #      violation) and exempts test files (a test may assert absence).
    #
    #   2. Visual regression — Playwright screenshot comparison at a 0.1% pixel
    #      threshold over five key surfaces (login, reviews list, review detail,
    #      contract/upload, admin), with volatile content (ids, dates) masked.
    #      Gated behind DESIGN_QA=1 so the default e2e suite stays independent of
    #      spec ordering; here the database is freshly bootstrapped, so every
    #      baseline page renders identical content every run.
    #
    # Baselines are Linux/Chromium and live in e2e/visual.spec.ts-snapshots/.
    # Regenerate deliberately with `npm run design-qa -- --update-snapshots` and
    # review the image diff like any other diff.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalmind
          POSTGRES_PASSWORD: legalmind
          POSTGRES_DB: legalmind_v1_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Forbidden terms (rule 12 / AI-03 item 16)
        working-directory: frontend
        run: npm run check:terms
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]' && pip install uvicorn
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Visual regression (0.1% threshold)
        working-directory: frontend
        env:
          DESIGN_QA: "1"
        run: npm run design-qa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs
          path: frontend/test-results/
          retention-days: 7
