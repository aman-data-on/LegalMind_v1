# Service isolation — added 2026-09-14.
#
# Why this matters here specifically: both services parse ATTACKER-SUPPLIED PDFs
# and DOCXs, and parsing shells out to ocrmypdf/tesseract. That is the real attack
# surface — a parser exploit, not a file-borne virus a signature scanner would
# catch. Before this drop-in both ran as root with no isolation at all: no
# NoNewPrivileges, no private /tmp, no memory ceiling, full write access to the
# filesystem.
#
# ProtectHome is deliberately NOT set: the application, its configuration and its
# object storage all live under /root, so protecting it would break the service.
# That is a symptom of running from /root at all — relocating the deployment out
# of a home directory is the real fix, and is recorded as outstanding.
[Service]
# A parser exploit cannot gain privileges through a setuid binary.
NoNewPrivileges=yes
# ocrmypdf and tesseract write temp files; give them a private /tmp that is
# destroyed with the service rather than one shared with every other process.
PrivateTmp=yes
# /usr, /boot, /efi and /etc become read-only. The application writes only to its
# own tree and the database.
ProtectSystem=full
# No raw device access — nothing here needs it (the embedding model is CPU ONNX).
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
# Bound a memory bomb in a crafted document. Measured steady state is well under
# 200 MB for both services; 3G leaves generous headroom for OCR on a large scan
# while still stopping runaway growth from taking the host down.
MemoryMax=3G
# Bound a fork bomb.
TasksMax=512
