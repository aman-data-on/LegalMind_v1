# LegalMind — LIST, never auto-restart, the services that hold data or jobs. nginx stays
# automatic: it is internet-facing, and a restart costs about a second.
# Install: /etc/needrestart/conf.d/legalmind.conf (root, 644). NOT installed until the
# owner approves (ops/production/README.md, "Patching window").
#
# Why: on 2026-10-16 an automatic libsystemd0 upgrade made needrestart restart
# PostgreSQL, Redis, nginx AND legalmind-worker at 06:21 — none of their own packages
# changed. A worker restarted mid-analysis loses the job until it is redelivered.
# With this file those services are reported as needing a restart
# (`needrestart -r l`) and restarted in the patching window, in order.
$nrconf{override_rc}{qr(^postgresql)} = 0;
$nrconf{override_rc}{qr(^redis-server)} = 0;
$nrconf{override_rc}{qr(^legalmind-)} = 0;
