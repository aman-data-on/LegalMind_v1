# LegalMind — edge reverse proxy for legalmind.lsnw.io
#
# THIS FILE IS THE SOURCE OF TRUTH. It is installed to
# /etc/nginx/sites-available/legalmind.lsnw.io; do not edit the copy in /etc.
# `ops/deploy.sh` warns when the two drift. Until 2026-09-22 the edge config
# existed only in /etc, unversioned and unreviewed, which is how the auth
# rate-limit defect below survived unnoticed.
#
# Step 55.1 deployment shape: Browser → Next.js (frontend) → FastAPI (API).
# Frontend and API sit behind ONE origin so the locked S-3 session cookie
# (`Secure; SameSite=Strict; HttpOnly`) is never sent cross-origin.
#
# Step 55.2 requires rate limiting AT THE EDGE as well as in the application
# (S-5). The application limiter stays authoritative; this is defence in depth.

# Keyed on the client address, matching the application limiter's own key
# (backend/legalmind/api/routers/auth.py — keyed on client, never on the
# submitted email, so an attacker cannot lock a named user out).
limit_req_zone $binary_remote_addr zone=legalmind_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=legalmind_api:10m rate=120r/m;

# 429, not nginx's 503 default. A refused request is the client's rate problem,
# not "the server is down" — and the frontend already renders 429 correctly
# ("Too many requests. Please try again shortly.", frontend/src/lib/api.ts
# `isRateLimited`). Serving 503 meant that message could never fire and the
# reader got a bare nginx page instead.
limit_req_status 429;

server {
    server_name legalmind.lsnw.io;

    # Matches LEGALMIND_MAX_UPLOAD_BYTES (backend/legalmind/config.py: 25 MiB,
    # lowered from 50 MiB by owner instruction 2026-09-02). Deliberately the
    # same number — the edge must not admit a body the application will
    # refuse, nor refuse one it would accept. A body over this limit gets
    # nginx's own raw 413 page (not JSON), which the frontend cannot parse as
    # a structured API error — found 2026-09-03 while diagnosing an upload
    # that failed with the generic "request could not be completed" message;
    # this number had gone stale when the application default changed and
    # this file did not.
    client_max_body_size 25M;

    # Security response headers — added 2026-09-14. All six were absent.
    #
    # `always` matters: without it nginx omits the header on 4xx/5xx, so an error
    # page would be the one response served without protection.
    #
    # HSTS: the site is already HTTPS-only with a 301 from :80, so this only
    # removes the first-request window. Two years, subdomains included. `preload`
    # is deliberately NOT set — that is a one-way submission to browser vendors and
    # belongs to whoever owns the lsnw.io domain, not to this server block.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # LegalMind is never framed. Clickjacking a Decision control is the specific
    # risk: a legal decision must be a deliberate act by an authorized person.
    add_header X-Frame-Options "DENY" always;
    # The upload path accepts PDF and DOCX. Content sniffing is exactly how a
    # stored file gets reinterpreted as something executable.
    add_header X-Content-Type-Options "nosniff" always;
    # Contract and review URLs carry identifiers. Send the origin cross-site, the
    # full path only same-origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The product uses none of these. Denying them costs nothing and removes the
    # surface entirely.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Content-Security-Policy is deliberately NOT set here yet: Next.js ships
    # inline bootstrap script, so a correct policy needs per-request nonces from
    # the application rather than a static header, and a wrong one silently breaks
    # the app. Tracked in ops/production/README.md as the next security step.

    # TLS terminates here, so the application must be told the original scheme:
    # without this the `Secure` cookie flag and any redirect would be computed
    # against plain HTTP.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Credential submission is the brute-force surface, and the tightest edge
    # limit (S-5) belongs HERE — unchanged at 10r/m burst=5.
    location = /api/v1/auth/login {
        limit_req zone=legalmind_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # The REST of /auth/ guesses no secret, and must not spend the credential
    # budget. Fixed 2026-09-22 after readers were refused at sign-in:
    # `GET /auth/session` is issued by SessionProvider on every page render, so
    # six ordinary navigations drained a 10-per-minute bucket, and the click on
    # "Sign in" — /auth/oidc/start — was then refused at the edge. Worse, each
    # refusal bounced the reader back to /login, which fetched the session
    # again: the limiter fed its own trigger. Seen 11:22, 11:23, 15:42 and
    # 15:46 on 2026-09-22 and back to 17 Sep, and already worked around in
    # backend/tools/run_contract_tests.py.
    #
    # /auth/session, /auth/logout, /auth/oidc/start and /auth/oidc/callback all
    # take the general API limit. The application limiter stays authoritative
    # (S-5); this is still defence in depth, just not aimed at the reader.
    location /api/v1/auth/ {
        limit_req zone=legalmind_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # The API. Routed straight to FastAPI rather than through the frontend's
    # dev-time rewrite: one fewer hop, and it does not depend on a dev-only
    # Next.js config (frontend/next.config.ts).
    location /api/v1/ {
        limit_req zone=legalmind_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;

        # Analysis and document requests can be slow; a document version's
        # content is streamed.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Everything else is the Next.js frontend.
    location / {
        proxy_pass http://127.0.0.1:3000;

        # Next.js needs the WebSocket upgrade (dev HMR, and React streaming).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # A reader must never meet nginx's bare "502 Bad Gateway" again. Both
    # upstreams are restarted by ops/deploy.sh, so there is a two-to-three
    # second window per deploy in which a page load or an XHR gets ECONNREFUSED.
    # The window is inherent to restart-in-place and is not worth a blue-green
    # rig; what was wrong is what it looked like. Static, no upstream, so it
    # cannot fail for the same reason the request did.
    error_page 502 503 504 /__unavailable.html;
    location = /__unavailable.html {
        root /usr/share/legalmind;
        internal;
        add_header Cache-Control "no-store" always;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/legalmind.lsnw.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/legalmind.lsnw.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = legalmind.lsnw.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name legalmind.lsnw.io;
    return 404; # managed by Certbot


}